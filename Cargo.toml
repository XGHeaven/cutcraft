[package]
name = "cutcraft"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Agent-first non-linear editing with exact rational time and atomic operations"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
jsonschema = { version = "0.29", default-features = false }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v7"] }

[profile.release]
lto = "thin"
strip = true
