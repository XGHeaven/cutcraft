name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Rust ${{ matrix.rust }} checks
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.86.0', stable]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core shellcheck
      - run: python3 scripts/release.py check
      - run: python3 scripts/test-packaging.py
      - run: shellcheck scripts/*.sh
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
        env:
          CUTCRAFT_REQUIRE_FFMPEG: '1'

  distribution:
    name: Binary / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CUTCRAFT_REQUIRE_FFMPEG: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: '1.86.0'
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - if: runner.os == 'macOS'
        run: |
          brew install ffmpeg@7
          echo "$(brew --prefix ffmpeg@7)/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Configure Windows font discovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'fonts.conf'
          $fonts = ($env:WINDIR + '/Fonts').Replace('\', '/')
          $cache = (Join-Path $env:RUNNER_TEMP 'font-cache').Replace('\', '/')
          New-Item -ItemType Directory -Path $cache -Force | Out-Null
          "<fontconfig><dir>$fonts</dir><cachedir>$cache</cachedir></fontconfig>" | Set-Content -Encoding utf8 $config
          "FONTCONFIG_FILE=$config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check text rendering dependency
        run: ffmpeg -v error -f lavfi -i 'color=s=16x16:d=0.1,drawtext=text=Cutcraft' -frames:v 1 -f null -
      - run: cargo test --locked
      - run: python scripts/release.py package --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - run: python scripts/release.py assemble --partial
      - if: runner.os != 'Windows'
        run: python scripts/test-release.py --dist dist
      - if: runner.os == 'Windows'
        run: python scripts/test-windows-release.py --dist dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-${{ matrix.target }}
          path: dist/cutcraft-v*-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  cross-linux:
    name: Cross binary / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            gcc: aarch64-linux-gnu
            qemu: qemu-aarch64
          - target: armv7-unknown-linux-gnueabihf
            gcc: arm-linux-gnueabihf
            qemu: qemu-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: '1.86.0'
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install cross linker and emulator
        run: sudo apt-get update && sudo apt-get install -y gcc-${{ matrix.gcc }} qemu-user
      - name: Configure Cargo cross target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CROSS_GCC: ${{ matrix.gcc }}
          QEMU: ${{ matrix.qemu }}
        run: |
          key="${TARGET^^}"
          key="${key//-/_}"
          echo "CARGO_TARGET_${key}_LINKER=${CROSS_GCC}-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${key}_RUNNER=${QEMU} -L /usr/${CROSS_GCC}" >> "$GITHUB_ENV"
      - name: Run target library and animation tests under QEMU
        run: cargo test --locked --target "${{ matrix.target }}" --lib --test animation
      - name: Package and run target executable under QEMU
        run: python3 scripts/release.py package --target "${{ matrix.target }}" --runner "${{ matrix.qemu }} -L /usr/${{ matrix.gcc }}"
      - name: Check packaged target executable and checksums
        run: |
          python3 scripts/release.py assemble --partial
          python3 scripts/test-cross-release.py --dist dist --target "${{ matrix.target }}" --runner "${{ matrix.qemu }} -L /usr/${{ matrix.gcc }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-${{ matrix.target }}
          path: dist/cutcraft-v*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7
