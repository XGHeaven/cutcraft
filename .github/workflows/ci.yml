name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Rust ${{ matrix.rust }} checks
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.86.0', stable]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core shellcheck
      - run: python3 scripts/release.py check
      - run: shellcheck scripts/*.sh
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
        env:
          CUTCRAFT_REQUIRE_FFMPEG: '1'

  distribution:
    name: Binary / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CUTCRAFT_REQUIRE_FFMPEG: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: '1.86.0'
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - if: runner.os == 'macOS'
        run: |
          brew install ffmpeg@7
          echo "$(brew --prefix ffmpeg@7)/bin" >> "$GITHUB_PATH"
      - name: Check text rendering dependency
        run: ffmpeg -v error -f lavfi -i 'color=s=16x16:d=0.1,drawtext=text=Cutcraft' -frames:v 1 -f null -
      - run: cargo test --locked
      - run: python3 scripts/release.py package --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - run: python3 scripts/release.py assemble --partial
      - run: python3 scripts/test-release.py --dist dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-${{ matrix.target }}
          path: dist/cutcraft-v*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7
